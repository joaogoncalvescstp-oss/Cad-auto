<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAD Auto</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Design system borrowed from FBK Checker (navy + gold, mono labels, dark stage). */
:root{
  --navy:#071D49; --navy2:#0c2a66; --gold:#F1B434; --gold-dim:#b8861f;
  --bg:#0a0f1c; --panel:#0f1626; --panel2:#131c30; --rule:#22304d;
  --ink:#e8edf6; --mut:#8a99b8; --grid:#16203a;
  --pass:#35c184; --warn:#f0b429; --fail:#ff5d52; --pt:#7fb3ff; --ctrl:#ffd24a;
  --curb:#35c184; --bldg:#7fb3ff;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.bar{display:flex;align-items:center;gap:12px;padding:9px 14px;background:linear-gradient(180deg,var(--navy),var(--navy2));border-bottom:3px solid var(--gold);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.brand{display:flex;flex-direction:column;line-height:1.05;flex-shrink:0;white-space:nowrap}
.brand .k{font:600 9px/1 var(--mono);letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.brand .t{font-weight:700;font-size:15px}
.bar .grow{flex:1 0 auto;min-width:12px}
.bar>*{flex-shrink:0}
.btn{background:#13213f;color:var(--ink);border:1px solid var(--rule);padding:7px 12px;border-radius:6px;font:600 12px var(--mono);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--gold-dim);background:#182a4f}
.btn.gold{background:var(--gold);color:#1b1300;border-color:var(--gold)}
.btn.gold:hover{background:#ffc94d}
.btn.ghost{background:transparent}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%;justify-content:center}
.pill{font:600 11px var(--mono);color:var(--mut);padding:3px 8px;border:1px solid var(--rule);border-radius:20px}
.seg{display:inline-flex}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:6px 0 0 6px}
.seg .btn:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
#spaceBadge{font-size:14px;font-weight:700;letter-spacing:.06em;margin-left:12px;cursor:pointer;transition:transform .2s;white-space:nowrap}
.main{display:grid;grid-template-columns:1fr 320px;min-height:0}
.stage{position:relative;min-height:0;background:radial-gradient(120% 120% at 30% 0%,#0c1426,#070b16)}
#map{position:absolute;inset:0;z-index:0;background:#070b16}
#map.selecting{cursor:crosshair}
#map .leaflet-control-attribution{background:rgba(7,11,22,.7);color:var(--mut);font:10px var(--mono)}
#map .leaflet-control-attribution a{color:var(--pt)}
canvas{position:absolute;inset:0;display:none;width:100%;height:100%;touch-action:none;cursor:grab}
.stage.cad canvas{display:block}
.stage.cad #map{visibility:hidden}
.hud{position:absolute;left:12px;bottom:12px;z-index:500;font:600 11px var(--mono);color:var(--mut);background:rgba(7,11,22,.7);border:1px solid var(--rule);padding:6px 10px;border-radius:6px;pointer-events:none}
.tools{position:absolute;left:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:6px}
.tool{width:40px;height:40px;border-radius:8px;border:1px solid var(--rule);background:rgba(15,22,38,.85);color:var(--mut);cursor:pointer;font:700 14px var(--mono);display:grid;place-items:center}
.tool:hover{color:var(--ink);border-color:var(--gold-dim)}
.tool.on{background:var(--gold);color:#1b1300;border-color:var(--gold)}
.tool[hidden]{display:none}
.legend{position:absolute;right:12px;top:12px;z-index:500;background:rgba(7,11,22,.72);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;font:600 11px var(--mono);color:var(--mut);display:grid;gap:5px}
.legend i{display:inline-block;width:14px;height:3px;margin-right:7px;vertical-align:3px}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:600;background:#2a1f08;border:1px solid var(--gold-dim);border-radius:6px;padding:7px 12px;font:600 11px var(--mono);color:#f3d99a;display:none;max-width:70%;text-align:center}
.banner.show{display:block}
.side{background:var(--panel);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.side h3{font:700 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:12px 14px 8px;border-bottom:1px solid var(--rule)}
.scroll{overflow:auto;flex:1;padding:12px 14px}
.sec{margin-bottom:16px}
.sec h4{font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.field{margin-bottom:10px}
.field label{display:block;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--rule);color:var(--ink);border-radius:6px;padding:7px 9px;font:12px var(--mono)}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold-dim)}
.field input[type=range]{padding:0;border:none;background:none;accent-color:var(--gold)}
.lyr{background:var(--panel2);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;margin-bottom:8px}
.lyr .hd{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);cursor:pointer}
.lyr .hd i{display:inline-block;width:14px;height:3px;margin-left:auto}
.lyr input[type=checkbox]{accent-color:var(--gold)}
.lyr .field{margin:8px 0 0}
.note{font-size:11px;color:var(--mut);line-height:1.5;margin-top:6px}
.kv{display:flex;justify-content:space-between;font:12px var(--mono);padding:4px 0;border-bottom:1px dotted var(--rule)}
.kv .k{color:var(--mut)} .kv .v{color:var(--ink)}
.log{border-top:1px solid var(--rule);max-height:28%;display:flex;flex-direction:column}
.log h3{display:flex;align-items:center;gap:8px}
.log .n{margin-left:auto;background:var(--gold);color:#1b1300;border-radius:20px;font:700 10px var(--mono);padding:1px 8px}
.logscroll{overflow:auto;padding:4px 14px 12px}
.le{font:11px/1.4 var(--mono);padding:6px 0;border-bottom:1px dotted var(--rule);color:var(--mut)}
.le b{color:var(--ink)} .le.err{color:var(--fail)} .le.ok{color:var(--pass)}
@media(max-width:840px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr 45%}
  .side{border-left:none;border-top:1px solid var(--rule)}
  .legend{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand"><span class="k">CAD · Automation</span><span class="t">CAD Auto</span></div>
    <span class="pill" id="jobpill">no drawing</span>
    <div class="grow"></div>
    <div class="seg">
      <button class="btn on" id="viewMapBtn" title="Aerial map — select an area to draft from">🛰 Aerial</button>
      <button class="btn" id="viewCadBtn" title="CAD view of the drafted linework">📐 CAD</button>
    </div>
    <button class="btn ghost" id="fitBtn" title="Zoom to the drafted linework">⊡ Fit</button>
    <button class="btn ghost" id="clearBtn" disabled title="Delete all drafted linework">✕ Clear</button>
    <button class="btn gold" id="dxfBtn" disabled title="Download the drafted linework as a DXF (layers CURB, BLDG)">↓ Export DXF</button>
    <span id="spaceBadge" title="version" onclick="spinBadge()">🌙 MOON</span>
  </div>

  <div class="main">
    <div class="stage" id="stage">
      <div id="map"></div>
      <canvas id="cv"></canvas>
      <div class="tools">
        <button class="tool" id="selTool" title="Select area: drag a box on the aerial">▭</button>
        <button class="tool" id="viewSelTool" title="Use the whole visible map as the area">⛶</button>
      </div>
      <div class="legend"><span><i style="background:var(--curb)"></i>CURB</span><span><i style="background:var(--bldg)"></i>BLDG</span><span><i style="background:var(--gold)"></i>AREA</span></div>
      <div class="banner" id="banner"></div>
      <div class="hud" id="hud">ready</div>
    </div>
    <aside class="side">
      <h3>Draft from map</h3>
      <div class="scroll">
        <div class="sec">
          <h4>1 · Area</h4>
          <div id="areaInfo" class="note">Click <b>▭</b> and drag a box on the aerial, or <b>⛶</b> to use the visible map.</div>
        </div>
        <div class="sec">
          <h4>2 · Layers</h4>
          <div class="lyr">
            <label class="hd"><input type="checkbox" id="curbOn" checked> Curb lines <i style="background:var(--curb)"></i></label>
            <div class="field"><label>Source</label>
              <select id="curbSrc"><option value="aerial">Auto-trace from aerial image</option><option value="osm">OpenStreetMap (barrier=kerb)</option><option value="arcgis">ArcGIS layer URL</option></select></div>
            <div class="field" id="curbUrlF" hidden><label>Curb layer URL</label><input id="curbUrl" placeholder="https://…/MapServer/0"></div>
            <div id="traceF">
              <div class="field"><label>Pavement tolerance <span id="traceTolV">1.0</span></label><input type="range" id="traceTol" min="0.5" max="2" step="0.1" value="1"></div>
              <div class="field"><label>Max curb offset from centerline (ft)</label><input type="number" id="traceMax" min="10" max="120" step="5" value="45"></div>
              <label class="hd" style="font-size:11px;margin-top:6px"><input type="checkbox" id="showPave"> Show detected pavement</label>
            </div>
          </div>
          <div class="lyr">
            <label class="hd"><input type="checkbox" id="bldgOn" checked> Buildings <i style="background:var(--bldg)"></i></label>
            <div class="field"><label>Source</label>
              <select id="bldgSrc"><option value="osm">OpenStreetMap (building=*)</option><option value="arcgis">ArcGIS layer URL</option></select></div>
            <div class="field" id="bldgUrlF" hidden><label>Building layer URL</label><input id="bldgUrl" placeholder="https://…/FeatureServer/0"></div>
          </div>
          <div class="note">ArcGIS: paste a MapServer/FeatureServer <b>layer</b> URL (ends in <code>/0</code>, <code>/3</code>…). CORS isn't required.</div>
        </div>
        <div class="sec">
          <h4>3 · Output</h4>
          <div class="field"><label>Coordinates</label>
            <select id="crs"><option value="ramsey">Ramsey County (US ft)</option><option value="local">Local (ft, SW corner = 0,0)</option></select></div>
          <div class="field"><label>Aerial</label>
            <select id="basemap"><option value="esri">Esri World Imagery</option><option value="ramsey">Ramsey County 2024</option></select></div>
          <button class="btn gold wide" id="draftBtn" disabled>✏ Draft CAD lines</button>
        </div>
        <div class="sec" id="drawInfo"></div>
      </div>
      <div class="log">
        <h3>Log <span class="n" id="logN">0</span></h3>
        <div class="logscroll" id="logList"></div>
      </div>
    </aside>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

// VERSION MARKER — bumped on every push so you can confirm the page isn't cached.
// If the badge matches what Claude said it pushed, you have the latest build.
const VERSION={emoji:'🌙',name:'MOON',build:3};
function showVersion(){const b=$('spaceBadge');b.textContent=`${VERSION.emoji} ${VERSION.name}`;b.title=`Build ${VERSION.build} · ${VERSION.name} — if this matches what Claude pushed, you're on the latest (no cache)`;}
function spinBadge(){const b=$('spaceBadge');b.style.transform='rotate(360deg)';setTimeout(()=>{b.style.transform='rotate(0deg)';},200);}

/* ---------- log / banner ---------- */
const logEntries=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function log(html,cls=''){logEntries.unshift(`<div class="le ${cls}">${html}</div>`);$('logN').textContent=logEntries.length;$('logList').innerHTML=logEntries.join('');}
let bannerT=0;
function banner(msg,ms=4000){const b=$('banner');b.textContent=msg;b.classList.add('show');clearTimeout(bannerT);if(ms)bannerT=setTimeout(()=>b.classList.remove('show'),ms);}

/* ---------- Ramsey County LCC (US ft) — same calibrated transform as FBK Checker ---------- */
const RC={};
(function(){const a=6378418.941,b=6357033.31,D=Math.PI/180;
  const e=Math.sqrt(1-b*b/(a*a));
  const dms=(d,mn,s)=>Math.sign(d)*(Math.abs(d)+mn/60+s/3600);
  const phi1=dms(44,53,0)*D,phi2=dms(45,8,0)*D,lam0=dms(-93,23,0)*D,phi0=dms(44,47,28)*D;
  const mm=p=>Math.cos(p)/Math.sqrt(1-e*e*Math.sin(p)*Math.sin(p));
  const tt=p=>Math.tan(Math.PI/4-p/2)/Math.pow((1-e*Math.sin(p))/(1+e*Math.sin(p)),e/2);
  const n=(Math.log(mm(phi1))-Math.log(mm(phi2)))/(Math.log(tt(phi1))-Math.log(tt(phi2)));
  const F=mm(phi1)/(n*Math.pow(tt(phi1),n)),rho0=a*F*Math.pow(tt(phi0),n);
  Object.assign(RC,{a,e,D,lam0,n,F,rho0,t:tt,FT:0.3048006096012,FE:500000,FN:100000});})();
function llToSurvey(la,lo){const phi=la*RC.D,lam=lo*RC.D;
  const rho=RC.a*RC.F*Math.pow(RC.t(phi),RC.n),th=RC.n*(lam-RC.lam0);
  const x=rho*Math.sin(th),y=RC.rho0-rho*Math.cos(th);
  return [RC.FE+x/RC.FT,RC.FN+y/RC.FT];}

/* ---------- state ---------- */
let area=null;            // {s,w,n,e} in lat/lon
let drawing=null;         // {crs, origin:[E0,N0], layers:{CURB:[{pts:[[E,N]],closed}], BLDG:[…]}}
let view='map';
const LS={get(k,d){try{return localStorage.getItem('cadauto.'+k)??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem('cadauto.'+k,v);}catch(e){}}};

/* ---------- aerial map (Leaflet) ---------- */
let map=null,baseLayer=null,areaRect=null,overlay=null,selecting=false;
const BASEMAPS={
  esri:()=>L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:21,maxNativeZoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}),
  // County ImageServer isn't tiled in Web Mercator: ask it for 256px tiles reprojected to 3857.
  ramsey:()=>{const T=L.TileLayer.extend({getTileUrl(c){const z=this._getZoomForUrl(),n=Math.pow(2,z),R=6378137,W=2*Math.PI*R/n;
      const x0=-Math.PI*R+c.x*W,y1=Math.PI*R-c.y*W;
      return 'https://maps.co.ramsey.mn.us/arcgis/rest/services/OrthoPhotos/Aerial2024/ImageServer/exportImage'+
        `?bbox=${x0},${y1-W},${x0+W},${y1}&bboxSR=3857&imageSR=3857&size=256,256&adjustAspectRatio=false&format=jpgpng&f=image`;}});
    return new T('',{maxZoom:21,maxNativeZoom:21,minZoom:11,attribution:'Imagery © Ramsey County'});}
};
function setBasemap(k){if(!map)return;if(baseLayer)map.removeLayer(baseLayer);
  baseLayer=(BASEMAPS[k]||BASEMAPS.esri)();let errs=0;
  baseLayer.on('tileerror',()=>{if(++errs===8&&k!=='esri'){banner('Ramsey County aerial isn\'t loading here — switched to Esri.');$('basemap').value='esri';setBasemap('esri');}});
  baseLayer.addTo(map);LS.set('basemap',k);}

function initMap(){
  if(!window.L){banner('Map library failed to load — check your connection.',0);return;}
  const c=JSON.parse(LS.get('view','null')||'null')||{lat:44.9537,lng:-93.0900,z:17};
  map=L.map('map',{zoomControl:false,boxZoom:false}).setView([c.lat,c.lng],c.z);
  L.control.zoom({position:'bottomright'}).addTo(map);
  overlay=L.layerGroup().addTo(map);
  setBasemap(LS.get('basemap','esri'));
  map.on('moveend',()=>{const m=map.getCenter();LS.set('view',JSON.stringify({lat:m.lat,lng:m.lng,z:map.getZoom()}));hudMap();});
  map.on('mousemove',e=>{if(view!=='map')return;const[E,N]=llToSurvey(e.latlng.lat,e.latlng.lng);
    $('hud').textContent=`E ${E.toFixed(1)}  N ${N.toFixed(1)}  ·  ${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;});
  // drag-a-box selection
  let start=null,box=null;
  map.on('mousedown',e=>{if(!selecting)return;start=e.latlng;box=L.rectangle([start,start],{color:'#F1B434',weight:2,fillOpacity:.08,dashArray:'6 4'}).addTo(map);});
  map.on('mousemove',e=>{if(start&&box)box.setBounds([start,e.latlng]);});
  map.on('mouseup',e=>{if(!start)return;$('banner').classList.remove('show');const b=L.latLngBounds(start,e.latlng);map.removeLayer(box);start=box=null;
    setSelecting(false);if(map.latLngToContainerPoint(b.getNorthWest()).distanceTo(map.latLngToContainerPoint(b.getSouthEast()))<8){banner('Box too small — drag a larger area.');return;}
    setArea(b);});
  hudMap();
}
function hudMap(){if(view==='map'&&map)$('hud').textContent=`zoom ${map.getZoom()}`+(area?'  ·  area selected':'');}
function setSelecting(on){selecting=on;$('selTool').classList.toggle('on',on);$('map').classList.toggle('selecting',on);
  if(!map)return;on?map.dragging.disable():map.dragging.enable();if(on)banner('Drag a box around the curbs and buildings to draft.',3000);}
function setArea(b){
  area={s:b.getSouth(),w:b.getWest(),n:b.getNorth(),e:b.getEast()};
  if(areaRect)map.removeLayer(areaRect);
  areaRect=L.rectangle(b,{color:'#F1B434',weight:2,fill:false,dashArray:'6 4',interactive:false}).addTo(map);
  const[E1,N1]=llToSurvey(area.s,area.w),[E2,N2]=llToSurvey(area.n,area.e);
  const wft=Math.abs(E2-E1),hft=Math.abs(N2-N1);
  $('areaInfo').innerHTML=`<div class="kv"><span class="k">Size</span><span class="v">${wft.toFixed(0)} × ${hft.toFixed(0)} ft</span></div>`+
    `<div class="kv"><span class="k">SW</span><span class="v">${area.s.toFixed(6)}, ${area.w.toFixed(6)}</span></div>`+
    `<div class="kv"><span class="k">NE</span><span class="v">${area.n.toFixed(6)}, ${area.e.toFixed(6)}</span></div>`+
    (wft*hft>2.5e7?`<div class="note" style="color:var(--warn)">Large area — drafting may be slow or hit server limits.</div>`:'');
  $('draftBtn').disabled=false;
  log(`Area selected: <b>${wft.toFixed(0)} × ${hft.toFixed(0)} ft</b>`);hudMap();
}

/* ---------- data sources ---------- */
// OpenStreetMap via Overpass (CORS-enabled). Returns [{pts:[[lat,lon]],closed}]
async function fetchOSM(kind,a){
  const bb=`${a.s},${a.w},${a.n},${a.e}`;
  const q=kind==='road'?`[out:json][timeout:25];(way["highway"~"${ROAD_RE}"](${bb}););out geom;`
    :kind==='curb'?`[out:json][timeout:25];(way["barrier"="kerb"](${bb}););out geom;`
    :`[out:json][timeout:25];(way["building"](${bb});relation["building"](${bb}););out geom;`;
  const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
  if(!r.ok)throw new Error(`OpenStreetMap HTTP ${r.status}`);
  const j=await r.json(),out=[];
  for(const el of j.elements||[]){
    if(el.type==='way'&&el.geometry)out.push(ring(el.geometry.map(g=>[g.lat,g.lon])));
    else if(el.type==='relation')for(const m of el.members||[])if(m.type==='way'&&m.role!=='inner'&&m.geometry)out.push(ring(m.geometry.map(g=>[g.lat,g.lon])));}
  return out;
}
function ring(pts){const a=pts[0],b=pts[pts.length-1];const closed=pts.length>3&&a[0]===b[0]&&a[1]===b[1];
  return{pts:closed?pts.slice(0,-1):pts,closed};}

// ArcGIS MapServer/FeatureServer layer via JSONP (works without CORS, like FBK's plain-<img> trick).
let jsonpN=0;
function jsonp(url,ms=25000){return new Promise((res,rej)=>{const cb='__cadauto_cb'+(++jsonpN),s=document.createElement('script');
  const done=()=>{delete window[cb];s.remove();clearTimeout(t);};
  const t=setTimeout(()=>{done();rej(new Error('ArcGIS request timed out'));},ms);
  window[cb]=d=>{done();res(d);};s.onerror=()=>{done();rej(new Error('ArcGIS request failed (bad URL or server unreachable)'));};
  s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(s);});}
async function fetchArcGIS(url,a){
  url=url.trim().replace(/\/+$/,'').replace(/\/query$/,'');
  if(!/\/(MapServer|FeatureServer)\/\d+$/i.test(url))throw new Error('ArcGIS URL must end in /MapServer/<n> or /FeatureServer/<n>');
  const out=[];let offset=0;
  for(let page=0;page<20;page++){
    const p=new URLSearchParams({where:'1=1',geometry:`${a.w},${a.s},${a.e},${a.n}`,geometryType:'esriGeometryEnvelope',inSR:'4326',
      spatialRel:'esriSpatialRelIntersects',outFields:'OBJECTID',returnGeometry:'true',outSR:'4326',f:'json'});
    if(page)p.set('resultOffset',offset);
    const j=await jsonp(`${url}/query?${p}`);
    if(j.error)throw new Error(`ArcGIS: ${j.error.message||'query failed'}${j.error.details?.length?' — '+j.error.details.join(' '):''}`);
    for(const f of j.features||[]){const g=f.geometry||{};
      for(const path of g.paths||[])out.push({pts:path.map(([x,y])=>[y,x]),closed:false});

  ctx.setLineDash([6,4]);ctx.strokeStyle=css('--gold');ctx.lineWidth=1.2;ctx.beginPath();
  [[a.s,a.w],[a.s,a.e],[a.n,a.e],[a.n,a.w]].map(toXY).map(W2S).forEach(([X,Y],i)=>i?ctx.lineTo(X,Y):ctx.moveTo(X,Y));ctx.closePath();ctx.stroke();ctx.setLineDash([]);
  for(const[k,col,lw]of[['BLDG','--bldg',1.5],['CURB','--curb',2]]){ctx.strokeStyle=css(col);ctx.lineWidth=lw;
    for(const f of drawing.layers[k]){ctx.beginPath();f.pts.map(W2S).forEach(([X,Y],i)=>i?ctx.lineTo(X,Y):ctx.moveTo(X,Y));if(f.closed)ctx.closePath();ctx.stroke();}}
  ctx.fillStyle=css('--mut');ctx.font='600 10px '+css('--mono');ctx.textAlign='right';ctx.fillText(`grid ${g} ft`,w-12,h-12);
}
function fitCad(){if(!drawing)return;let mnx=1/0,mny=1/0,mxx=-1/0,mxy=-1/0;
  const a=drawing.area,corners=[[a.s,a.w],[a.n,a.e]].map(([la,lo])=>{const[E,N]=llToSurvey(la,lo);return drawing.crs==='local'?[E-drawing.origin[0],N-drawing.origin[1]]:[E,N];});
  for(const f of[{pts:corners},...drawing.layers.CURB,...drawing.layers.BLDG])for(const[x,y]of f.pts){mnx=Math.min(mnx,x);mny=Math.min(mny,y);mxx=Math.max(mxx,x);mxy=Math.max(mxy,y);}
  if(!isFinite(mnx))return;needFit=false;cam.cx=(mnx+mxx)/2;cam.cy=(mny+mxy)/2;
  cam.s=Math.min((cv.clientWidth||800)/(mxx-mnx||10),(cv.clientHeight||600)/(mxy-mny||10))*.88;drawCad();}
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:cam.cx,cy:cam.cy};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),[x,y]=S2W(e.clientX-r.left,e.clientY-r.top);
  $('hud').textContent=`${drawing?.crs==='local'?'x':'E'} ${x.toFixed(2)}  ${drawing?.crs==='local'?'y':'N'} ${y.toFixed(2)}`;
  if(drag){cam.cx=drag.cx-(e.clientX-drag.x)/cam.s;cam.cy=drag.cy+(e.clientY-drag.y)/cam.s;drawCad();}});
cv.addEventListener('pointerup',()=>{drag=null;cv.style.cursor='grab';});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  const[wx,wy]=S2W(px,py);cam.s*=Math.exp(-e.deltaY*.0015);const[nx,ny]=S2W(px,py);cam.cx+=wx-nx;cam.cy+=wy-ny;drawCad();},{passive:false});

/* ---------- DXF (R12 ASCII: POLYLINE on layers CURB / BLDG) ---------- */
function exportDXF(){if(!drawing)return;const o=[],p=(c,v)=>o.push(c,v);
  p(0,'SECTION');p(2,'HEADER');p(9,'$ACADVER');p(1,'AC1009');p(0,'ENDSEC');
  p(0,'SECTION');p(2,'TABLES');p(0,'TABLE');p(2,'LAYER');p(70,3);
  for(const[n,c]of[['AREA',2],['CURB',3],['BLDG',5]]){p(0,'LAYER');p(2,n);p(70,0);p(62,c);p(6,'CONTINUOUS');}
  p(0,'ENDTAB');p(0,'ENDSEC');p(0,'SECTION');p(2,'ENTITIES');
  const poly=(lay,pts,closed)=>{p(0,'POLYLINE');p(8,lay);p(66,1);p(70,closed?1:0);p(10,0);p(20,0);p(30,0);
    for(const[x,y]of pts){p(0,'VERTEX');p(8,lay);p(10,x.toFixed(4));p(20,y.toFixed(4));p(30,0);}p(0,'SEQEND');p(8,lay);};
  for(const k of['CURB','BLDG'])for(const f of drawing.layers[k])poly(k,f.pts,f.closed);
  const a=drawing.area,toXY=q=>{const[E,N]=llToSurvey(q[0],q[1]);return drawing.crs==='local'?[E-drawing.origin[0],N-drawing.origin[1]]:[E,N];};
  poly('AREA',[[a.s,a.w],[a.s,a.e],[a.n,a.e],[a.n,a.w]].map(toXY),true);
  p(0,'ENDSEC');p(0,'EOF');
  const blob=new Blob([o.join('\r\n')+'\r\n'],{type:'application/dxf'}),u=URL.createObjectURL(blob),el=document.createElement('a');
  el.href=u;el.download=`cad-auto-${new Date().toISOString().slice(0,10)}.dxf`;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
  log(`Exported DXF (${drawing.layers.CURB.length} curb, ${drawing.layers.BLDG.length} bldg)`,'ok');}

/* ---------- view switching / wiring ---------- */
function setView(v){view=v;$('stage').classList.toggle('cad',v==='cad');$('viewMapBtn').classList.toggle('on',v==='map');$('viewCadBtn').classList.toggle('on',v==='cad');
  $('selTool').hidden=$('viewSelTool').hidden=v!=='map';
  if(v==='cad'){setSelecting(false);resize();if(needFit)fitCad();}else{map?.invalidateSize();hudMap();}}
$('viewMapBtn').onclick=()=>setView('map');
$('viewCadBtn').onclick=()=>setView('cad');
$('fitBtn').onclick=()=>{if(view==='cad')fitCad();else if(map){const b=drawing?overlay.getLayers().length&&L.featureGroup(overlay.getLayers()).getBounds():areaRect?.getBounds();if(b&&b.isValid())map.fitBounds(b,{padding:[30,30]});}};
$('selTool').onclick=()=>setSelecting(!selecting);
$('viewSelTool').onclick=()=>{if(map){setSelecting(false);setArea(map.getBounds().pad(-.03));}};
$('draftBtn').onclick=draft;
$('dxfBtn').onclick=exportDXF;
$('clearBtn').onclick=()=>{drawing=null;renderOverlay();updateDrawInfo();drawCad();log('Cleared drawing');};
for(const k of['curb','bldg']){
  const src=$(k+'Src'),url=$(k+'Url'),f=$(k+'UrlF'),tf=$('traceF');
  const sync=()=>{f.hidden=src.value!=='arcgis';if(k==='curb')tf.hidden=src.value!=='aerial';};
  src.value=LS.get(k+'Src',k==='curb'?'aerial':'osm');if(src.selectedIndex<0)src.value='osm';sync();
  src.onchange=()=>{sync();LS.set(k+'Src',src.value);};
  url.onchange=()=>LS.set(k+'Url',url.value.trim());}
$('traceTol').value=LS.get('traceTol','1');$('traceTolV').textContent=(+$('traceTol').value).toFixed(1);
$('traceTol').oninput=()=>{$('traceTolV').textContent=(+$('traceTol').value).toFixed(1);LS.set('traceTol',$('traceTol').value);};
$('traceMax').value=LS.get('traceMax','45');$('traceMax').onchange=()=>LS.set('traceMax',$('traceMax').value);
$('showPave').onchange=renderOverlay;
$('crs').value=LS.get('crs','ramsey');$('crs').onchange=()=>LS.set('crs',$('crs').value);
$('basemap').value=LS.get('basemap','esri');$('basemap').onchange=()=>setBasemap($('basemap').value);
document.addEventListener('keydown',e=>{if(e.key==='Escape')setSelecting(false);});
window.addEventListener('resize',()=>{if(view==='cad')resize();});
window.addEventListener('load',()=>{showVersion();initMap();updateDrawInfo();log('App started');});
</script>
